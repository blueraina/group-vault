name: Update maintenance timeline

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "!content/维护时间线.md"

permissions:
  contents: write

concurrency:
  group: maintenance-timeline
  cancel-in-progress: false

jobs:
  update-maintenance-timeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update maintenance timeline
        run: node scripts/update-maintenance-timeline.mjs

      - name: Commit maintenance timeline
        run: |
          if git diff --quiet -- content/维护时间线.md; then
            echo "No maintenance timeline changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/维护时间线.md
          git commit -m "chore: update maintenance timeline"
          git push
