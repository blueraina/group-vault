name: Update maintenance timeline

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "!content/维护时间线.md"
      - "!content/其他信息/维护时间线.md"

permissions:
  contents: write

concurrency:
  group: vault-writeback
  cancel-in-progress: false

jobs:
  update-maintenance-timeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Update maintenance timeline
        run: node scripts/update-maintenance-timeline.mjs

      - name: Update collaborator note index
        env:
          GITHUB_TOKEN: ${{ secrets.COLLABORATORS_TOKEN || github.token }}
        run: node scripts/update-collaborators.mjs

      - name: Commit generated pages
        run: |
          if git diff --quiet -- README.md data/collaborators.json functions/_lib/maintainers.generated.js content/其他信息/协作者.md content/其他信息/维护时间线.md content/assets/collaborators; then
            echo "No generated page changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/collaborators.json functions/_lib/maintainers.generated.js content/其他信息/协作者.md content/其他信息/维护时间线.md content/assets/collaborators
          git commit -m "chore: update generated pages"
          git pull --rebase origin main
          git push
